name: Dataset Ingestion and Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'datasets/**'
      - '.github/workflows/dataset-ingestion.yml'

permissions:
  contents: read

concurrency:
  group: dataset-ingestion-main
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: datasets/requirements.txt

      - name: Install dependencies
        run: pip install -r datasets/requirements.txt

      - name: Install spaCy English NER model
        run: python -m spacy download en_core_web_sm

      - name: Run unit tests
        run: python -m unittest discover -s datasets/tests -v

      - name: Download and normalize datasets
        run: python datasets/prepare.py

      - name: Validate normalized records
        run: python datasets/validate.py

      - name: Generate exploratory data analysis
        run: python datasets/eda.py

      - name: Clean normalized records conservatively
        run: python datasets/cleaning/clean.py

      - name: Validate cleaned records
        run: python datasets/validate.py --input datasets/cleaned

      - name: Detect near-duplicate tickets for human review
        run: python datasets/quality/near_duplicates.py

      - name: Generate consolidated quality report
        run: python datasets/quality_report.py

      - name: Generate stratified evaluation review queue
        run: python datasets/evaluation/sample_eval.py --size 150 --seed 20261112

      - name: Display ingestion report
        if: always()
        run: |
          if [ -f datasets/generated/manifest.json ]; then
            cat datasets/generated/manifest.json
          fi

      - name: Upload aggregate quality reports only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: support-dataset-quality-reports
          path: |
            datasets/generated/manifest.json
            datasets/eda/eda_summary.json
            datasets/eda/source_split_counts.csv
            datasets/eda/label_distribution.csv
            datasets/cleaned/cleaning_report.json
            datasets/quality_report/dataset_quality_report.json
            datasets/quality_report/DATASET_QUALITY_REPORT.md
            datasets/quality_report/near_duplicate_summary.json
            datasets/evaluation/review_queue_manifest.json
          retention-days: 30
