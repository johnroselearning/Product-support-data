name: Dataset Ingestion and Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'datasets/**'
      - '.github/workflows/dataset-ingestion.yml'

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: datasets/requirements.txt

      - name: Install dependencies
        run: pip install -r datasets/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s datasets/tests -v

      - name: Download and normalize datasets
        run: python datasets/prepare.py

      - name: Validate normalized records
        run: python datasets/validate.py

      - name: Generate exploratory data analysis
        run: python datasets/eda.py

      - name: Clean normalized records conservatively
        run: python datasets/cleaning/clean.py

      - name: Validate cleaned records
        run: python datasets/validate.py --input datasets/cleaned

      - name: Display ingestion report
        if: always()
        run: |
          if [ -f datasets/generated/manifest.json ]; then
            cat datasets/generated/manifest.json
          fi

      - name: Upload normalized dataset artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: normalized-support-dataset
          path: |
            datasets/generated/master/
            datasets/generated/sft/
            datasets/generated/manifest.json
            datasets/generated/duplicate_audit.jsonl
            datasets/generated/quarantine.jsonl
            datasets/eda/
            datasets/cleaned/
          retention-days: 30
