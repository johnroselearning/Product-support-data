name: Dataset pipeline tests
on:
  push:
    paths: ['datasets/**', '.github/workflows/dataset-tests.yml']
  pull_request:
    paths: ['datasets/**', '.github/workflows/dataset-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: datasets/requirements.txt
      - name: Install dataset dependencies
        run: pip install -r datasets/requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s datasets/tests -v
